config_version: 4.0
config_variables_file_path: uncommitted/config_variables.yml
plugins_directory: plugins/

stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend:
      class_name: DatabaseStoreBackend
      module_name: great_expectations.data_context.store.database_store_backend
      table_name: ge_expectations_store
      key_columns: [expectation_suite_name]
      credentials: ${validation_results_db}

  validation_results_store:
    class_name: ValidationResultsStore
    store_backend:
      class_name: DatabaseStoreBackend
      module_name: great_expectations.data_context.store.database_store_backend
      table_name: ge_validation_results_store
      credentials: ${validation_results_db}

  validation_results_store_minio:
    class_name: ValidationResultsStore
    store_backend:
      class_name: TupleS3StoreBackend
      bucket: mmix-prod-dataengineer-validation
      prefix: gx/validation_results_store/
      endpoint_url: http://minio.mix.io:9000

  checkpoint_store:
    class_name: CheckpointStore
    store_backend:
      class_name: DatabaseStoreBackend
      module_name: great_expectations.data_context.store.database_store_backend
      table_name: ge_checkpoint_store
      key_columns: [checkpoint_name]
      credentials: ${validation_results_db}

  validation_definition_store:
    class_name: ValidationDefinitionStore
    store_backend:
      class_name: DatabaseStoreBackend
      module_name: great_expectations.data_context.store.database_store_backend
      table_name: ge_validation_definition_store
      key_columns: [validation_definition_name]
      credentials: ${validation_results_db}


expectations_store_name: expectations_store
validation_results_store_name: validation_results_store_minio
checkpoint_store_name: checkpoint_store

data_docs_sites:
  minio_site:
    class_name: SiteBuilder
    show_how_to_buttons: false
    store_backend:
      class_name: TupleS3StoreBackend
      bucket: mmix-prod-dataengineer-validation
      prefix: gx/data_docs_sites/
      endpoint_url: http://minio.mix.io:9000
    site_index_builder:
      class_name: DefaultSiteIndexBuilder
fluent_datasources:
  news_datasource:
    type: spark
    id: 86ff2f1d-fb7f-43ac-a118-420230c8cc26
    assets:
      news_datasource_asset:
        type: dataframe
        id: 241c518a-3ffd-4fff-92bf-b721cb8387d8
        batch_metadata: {}
        batch_definitions:
          news_datasource_batch_definition_whole_dataframe:
            id: fb2f9980-f413-4e8f-b7d0-ea16626d7074
            partitioner:
analytics_enabled:
data_context_id:
